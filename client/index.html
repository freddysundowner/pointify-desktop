<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#9333ea" />
    <meta name="description" content="Pointify POS — An enterprise at your hand." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pointify" />
    <!-- iOS splash screens -->
    <link rel="apple-touch-startup-image" href="/icon-512.png" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Pointify POS</title>
    <style>
      html, body { margin: 0; padding: 0; background: #9333ea; height: 100%; }
      #root { height: 100%; }
      #splash {
        position: fixed; inset: 0; z-index: 99999;
        background: linear-gradient(160deg, #9333ea 0%, #7c3aed 100%);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 24px;
      }
      #splash-icon {
        width: 80px; height: 80px; border-radius: 20px;
        background: rgba(255,255,255,0.15);
        display: flex; align-items: center; justify-content: center;
      }
      #splash-spinner {
        width: 36px; height: 36px;
        border: 3px solid rgba(255,255,255,0.25);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      #splash-label {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.7);
        letter-spacing: 0.04em;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Splash shown immediately, hidden once React mounts -->
    <div id="splash">
      <div id="splash-icon">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <text x="24" y="34" text-anchor="middle" font-size="28" font-weight="800" fill="white" font-family="Arial,sans-serif">P</text>
        </svg>
      </div>
      <div id="splash-spinner"></div>
      <div id="splash-label">Pointify POS</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
