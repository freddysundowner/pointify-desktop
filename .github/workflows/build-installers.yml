name: Build Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  # ─────────────────────────────────────────────────────────────
  # Windows — builds PointifyPOS-Setup.exe using NSIS
  # ─────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    env:
      # Force all npm installs to use the public registry.
      # Lock files were generated inside Replit and have resolved URLs pointing to
      # package-firewall.replit.local — an address unreachable outside Replit.
      # NPM_CONFIG_REGISTRY overrides resolved URLs and beats every other npm config.
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Lock files were generated inside Replit and point to package-firewall.replit.local,
      # an address that only exists inside Replit. Delete them so npm re-resolves all
      # packages from the public registry on this runner.
      - name: Remove Replit-internal lock files
        shell: bash
        run: rm -f package-lock.json server/package-lock.json client/package-lock.json

      - name: Install root dependencies (provides esbuild)
        shell: bash
        run: npm install

      - name: Install server dependencies (needed before bundling)
        shell: bash
        run: cd server && npm install

      - name: Build client
        shell: bash
        run: cd client && npm install --legacy-peer-deps && npm run build

      - name: Bundle server with esbuild
        shell: bash
        run: |
          node_modules/.bin/esbuild server/src/index.ts \
            --bundle \
            --platform=node \
            --target=node18 \
            --format=cjs \
            --outfile=server/dist/index.cjs \
            --external:firebase-admin \
            "--external:@firebase/*" \
            "--external:@google-cloud/*" \
            --external:google-gax \
            "--external:@grpc/*" \
            --external:protobufjs \
            --external:google-auth-library \
            --external:gcp-metadata \
            "--external:@opentelemetry/*" \
            --external:fast-xml-parser \
            --external:jose \
            --external:multer

      - name: Trim server to production dependencies only
        shell: bash
        run: cd server && npm install --omit=dev

      - name: Download bundled node.exe
        shell: bash
        run: |
          curl -fL -o /tmp/node-win.zip \
            "https://nodejs.org/dist/v20.19.3/node-v20.19.3-win-x64.zip"
          mkdir -p installer/package
          unzip -j /tmp/node-win.zip \
            "node-v20.19.3-win-x64/node.exe" \
            -d installer/package/

      - name: Assemble installer package
        shell: bash
        run: |
          PKG="installer/package"
          mkdir -p "$PKG/server/dist" "$PKG/server/node_modules" "$PKG/client/dist"

          cp server/dist/index.cjs  "$PKG/server/dist/"
          cp server/package.json    "$PKG/server/"
          cp -r client/dist/.       "$PKG/client/dist/"

          # Copy only the external packages (firebase-admin ecosystem)
          for mod in firebase-admin @firebase @google-cloud google-gax @grpc \
                     protobufjs google-auth-library gcp-metadata @opentelemetry \
                     fast-xml-parser jose multer; do
            [ -d "server/node_modules/$mod" ] && \
              cp -r "server/node_modules/$mod" "$PKG/server/node_modules/" || true
          done

          # Generate a fresh SESSION_SECRET for this build
          SECRET=$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")
          printf "SESSION_SECRET=%s\nPORT=3000\nPOINTIFY_API_URL=https://api.pointifypos.com\nPOINTIFY_OFFLINE_API_URL=https://api.pointifypos.com\nNODE_ENV=production\n" "$SECRET" > "$PKG/.env"

          # Copy pre-made launcher scripts from repo
          cp scripts/windows/start.bat       "$PKG/Start Pointify POS.bat"
          cp run-background.vbs              "$PKG/run-background.vbs"
          cp setup-autostart.bat             "$PKG/setup-autostart.bat"
          cp SETUP.md                        "$PKG/README.txt"

      - name: Compile NSIS installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\NSIS\makensis.exe" installer\windows.nsi

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PointifyPOS-Windows-Setup
          path: installer/PointifyPOS-Setup.exe
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # macOS — builds PointifyPOS.dmg
  # ─────────────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Lock files were generated inside Replit and point to package-firewall.replit.local,
      # an address that only exists inside Replit. Delete them so npm re-resolves all
      # packages from the public registry on this runner.
      - name: Remove Replit-internal lock files
        run: rm -f package-lock.json server/package-lock.json client/package-lock.json

      - name: Install root dependencies (provides esbuild)
        run: npm install

      - name: Install server dependencies (needed before bundling)
        run: cd server && npm install

      - name: Build client
        run: cd client && npm install --legacy-peer-deps && npm run build

      - name: Bundle server with esbuild
        run: |
          node_modules/.bin/esbuild server/src/index.ts \
            --bundle \
            --platform=node \
            --target=node18 \
            --format=cjs \
            --outfile=server/dist/index.cjs \
            '--external:firebase-admin' \
            '--external:@firebase/*' \
            '--external:@google-cloud/*' \
            '--external:google-gax' \
            '--external:@grpc/*' \
            '--external:protobufjs' \
            '--external:google-auth-library' \
            '--external:gcp-metadata' \
            '--external:@opentelemetry/*' \
            '--external:fast-xml-parser' \
            '--external:jose' \
            '--external:multer'

      - name: Trim server to production dependencies only
        run: cd server && npm install --omit=dev

      - name: Download Node.js binaries for macOS (Intel + Apple Silicon)
        run: |
          NODE_VER="20.19.3"
          mkdir -p dist/PointifyPOS-Mac
          for ARCH in x64 arm64; do
            TAR="node-v${NODE_VER}-darwin-${ARCH}.tar.gz"
            echo "Downloading node-${ARCH}..."
            curl -fL -o "/tmp/${TAR}" "https://nodejs.org/dist/v${NODE_VER}/${TAR}"
            tar -xzf "/tmp/${TAR}" \
              -C /tmp \
              "node-v${NODE_VER}-darwin-${ARCH}/bin/node"
            cp "/tmp/node-v${NODE_VER}-darwin-${ARCH}/bin/node" \
               "dist/PointifyPOS-Mac/node-${ARCH}"
            chmod +x "dist/PointifyPOS-Mac/node-${ARCH}"
            echo "node-${ARCH}: $(du -sh dist/PointifyPOS-Mac/node-${ARCH} | cut -f1)"
          done

      - name: Assemble Mac package
        run: |
          PKG="dist/PointifyPOS-Mac"
          mkdir -p "$PKG/server/dist" "$PKG/server/node_modules" "$PKG/client/dist"

          cp server/dist/index.cjs  "$PKG/server/dist/"
          cp server/package.json    "$PKG/server/"
          cp -r client/dist/.       "$PKG/client/dist/"

          for mod in firebase-admin @firebase @google-cloud google-gax @grpc \
                     protobufjs google-auth-library gcp-metadata @opentelemetry \
                     fast-xml-parser jose multer; do
            [ -d "server/node_modules/$mod" ] && \
              cp -r "server/node_modules/$mod" "$PKG/server/node_modules/" || true
          done

          SECRET=$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")
          printf "SESSION_SECRET=%s\nPORT=3000\nPOINTIFY_API_URL=https://api.pointifypos.com\nPOINTIFY_OFFLINE_API_URL=https://api.pointifypos.com\nNODE_ENV=production\n" "$SECRET" > "$PKG/.env"

          # Copy pre-made launcher scripts from repo
          cp scripts/mac/start.command    "$PKG/Start Pointify POS.command"
          cp scripts/mac/setup-autostart.sh "$PKG/setup-autostart.sh"
          cp SETUP.md                       "$PKG/README.txt"
          chmod +x "$PKG/Start Pointify POS.command" "$PKG/setup-autostart.sh"

      - name: Create DMG
        run: |
          mkdir -p /tmp/dmg-staging
          cp -r dist/PointifyPOS-Mac /tmp/dmg-staging/"Pointify POS"
          ln -s /Applications /tmp/dmg-staging/Applications

          hdiutil create \
            -volname "Pointify POS" \
            -srcfolder /tmp/dmg-staging \
            -ov \
            -format UDZO \
            -o dist/PointifyPOS.dmg

          echo "DMG size: $(du -sh dist/PointifyPOS.dmg | cut -f1)"

      - name: Upload Mac DMG
        uses: actions/upload-artifact@v4
        with:
          name: PointifyPOS-Mac-DMG
          path: dist/PointifyPOS.dmg
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # Release — only runs when you push a version tag (e.g. v1.0.0)
  # ─────────────────────────────────────────────────────────────
  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: PointifyPOS-Windows-Setup

      - name: Download Mac DMG
        uses: actions/download-artifact@v4
        with:
          name: PointifyPOS-Mac-DMG

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Pointify POS ${{ github.ref_name }}"
          body: |
            ## Pointify POS ${{ github.ref_name }}

            | Platform | File | Notes |
            |---|---|---|
            | Windows | `PointifyPOS-Setup.exe` | Run installer as Administrator |
            | macOS | `PointifyPOS.dmg` | Open → drag to Applications |

            No separate Node.js install needed. Other tills connect via browser on the same network.
          files: |
            PointifyPOS-Setup.exe
            PointifyPOS.dmg
