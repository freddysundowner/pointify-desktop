name: Build Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  # ─────────────────────────────────────────────────────────────
  # Windows — builds PointifyPOS-Setup.exe using NSIS
  # ─────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install root deps so esbuild is available
      - name: Install root dependencies
        shell: bash
        run: npm install

      # Build the React frontend
      - name: Build client
        shell: bash
        run: cd client && npm install --legacy-peer-deps && npm run build

      # Bundle the server into a single .cjs file (firebase-admin kept external)
      - name: Build server bundle
        shell: bash
        run: |
          node_modules/.bin/esbuild server/src/index.ts \
            --bundle \
            --platform=node \
            --target=node18 \
            --format=cjs \
            --outfile=server/dist/index.cjs \
            --external:firebase-admin \
            "--external:@firebase/*" \
            "--external:@google-cloud/*" \
            --external:google-gax \
            "--external:@grpc/*" \
            --external:protobufjs \
            --external:google-auth-library \
            --external:gcp-metadata \
            "--external:@opentelemetry/*" \
            --external:fast-xml-parser \
            --external:jose \
            --external:multer

      # Install only production server deps (firebase-admin ecosystem)
      - name: Install server production dependencies
        shell: bash
        run: cd server && npm install --omit=dev

      # Download portable node.exe so users need nothing installed
      - name: Download node.exe (Windows x64)
        shell: bash
        run: |
          curl -fL -o /tmp/node-win.zip \
            "https://nodejs.org/dist/v20.19.3/node-v20.19.3-win-x64.zip"
          unzip -j /tmp/node-win.zip \
            "node-v20.19.3-win-x64/node.exe" \
            -d installer/package/

      # Assemble everything the installer will package
      - name: Assemble installer package
        shell: bash
        run: |
          PKG="installer/package"
          mkdir -p "$PKG/server/dist" "$PKG/server/node_modules" "$PKG/client/dist"

          # Built server
          cp server/dist/index.cjs "$PKG/server/dist/"
          cp server/package.json   "$PKG/server/"

          # Built frontend
          cp -r client/dist/. "$PKG/client/dist/"

          # External node_modules (firebase-admin ecosystem only)
          for pkg in firebase-admin @firebase @google-cloud google-gax @grpc \
                     protobufjs google-auth-library gcp-metadata @opentelemetry \
                     fast-xml-parser jose multer; do
            [ -d "server/node_modules/$pkg" ] && \
              cp -r "server/node_modules/$pkg" "$PKG/server/node_modules/"
          done

          # .env with fresh SESSION_SECRET
          SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
          cat > "$PKG/.env" << EOF
          SESSION_SECRET=${SECRET}
          PORT=3000
          POINTIFY_API_URL=https://api.pointifypos.com
          POINTIFY_OFFLINE_API_URL=https://api.pointifypos.com
          NODE_ENV=production
          EOF

          # Start script that uses bundled node.exe
          cat > "$PKG/Start Pointify POS.bat" << 'BAT'
          @echo off
          setlocal enabledelayedexpansion
          title Pointify POS Server

          if not exist "%~dp0.env" (
              echo ERROR: .env file not found.
              pause & exit /b 1
          )

          for /f "usebackq tokens=1,* delims==" %%A in ("%~dp0.env") do (
              set "ln=%%A"
              if not "!ln:~0,1!"=="#" if not "%%A"=="" set "%%A=%%B"
          )

          echo.
          echo  ============================================
          echo   Pointify POS  ^|  Port %PORT%
          echo  ============================================
          echo   Other tills: open a browser and go to
          for /f "tokens=2 delims=:" %%I in ('ipconfig ^| findstr /R "IPv4"') do (
              set "ip=%%I"
              set "ip=!ip: =!"
              if not "!ip!"=="127.0.0.1" echo     http://!ip!:%PORT%
          )
          echo  ============================================
          echo   Keep this window open. Press Ctrl+C to stop.
          echo.

          "%~dp0node.exe" "%~dp0server\dist\index.cjs"
          pause
          BAT

          # Silent background launcher (VBScript — no console window)
          cat > "$PKG/run-background.vbs" << 'VBS'
          Set WshShell = CreateObject("WScript.Shell")
          scriptDir = Left(WScript.ScriptFullName, InStrRev(WScript.ScriptFullName, "\"))
          WshShell.Run Chr(34) & scriptDir & "node.exe" & Chr(34) & _
            " " & Chr(34) & scriptDir & "server\dist\index.cjs" & Chr(34), 0, False
          VBS

          # Auto-start via Task Scheduler
          cat > "$PKG/setup-autostart.bat" << 'AUTO'
          @echo off
          set "DIR=%~dp0"
          set "DIR=%DIR:~0,-1%"
          echo Registering Pointify POS to start at boot...
          schtasks /delete /tn "PointifyPOS" /f >nul 2>&1
          schtasks /create /tn "PointifyPOS" /tr "wscript.exe \"%DIR%\run-background.vbs\"" /sc ONSTART /delay 0000:30 /ru SYSTEM /f
          echo Done! Pointify POS will now start automatically at boot.
          pause
          AUTO

          cp SETUP.md "$PKG/README.txt"

      # NSIS is pre-installed on windows-latest
      - name: Compile NSIS installer
        shell: cmd
        run: |
          cd installer
          "C:\Program Files (x86)\NSIS\makensis.exe" windows.nsi

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PointifyPOS-Windows-Setup
          path: installer/PointifyPOS-Setup.exe
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # macOS — builds PointifyPOS.dmg
  # ─────────────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install root deps so esbuild is available
      - name: Install root dependencies
        run: npm install

      # Build the React frontend
      - name: Build client
        run: cd client && npm install --legacy-peer-deps && npm run build

      # Bundle server
      - name: Build server bundle
        run: |
          node_modules/.bin/esbuild server/src/index.ts \
            --bundle \
            --platform=node \
            --target=node18 \
            --format=cjs \
            --outfile=server/dist/index.cjs \
            '--external:firebase-admin' \
            '--external:@firebase/*' \
            '--external:@google-cloud/*' \
            '--external:google-gax' \
            '--external:@grpc/*' \
            '--external:protobufjs' \
            '--external:google-auth-library' \
            '--external:gcp-metadata' \
            '--external:@opentelemetry/*' \
            '--external:fast-xml-parser' \
            '--external:jose' \
            '--external:multer'

      # Install only production server deps
      - name: Install server production dependencies
        run: cd server && npm install --omit=dev

      # Download both Mac node binaries (Intel + Apple Silicon)
      - name: Download Node.js binaries for macOS
        run: |
          NODE_VER="20.19.3"
          for ARCH in x64 arm64; do
            TAR="node-v${NODE_VER}-darwin-${ARCH}.tar.gz"
            curl -fL -o "/tmp/${TAR}" "https://nodejs.org/dist/v${NODE_VER}/${TAR}"
            tar -xzf "/tmp/${TAR}" -C /tmp \
              "node-v${NODE_VER}-darwin-${ARCH}/bin/node" 2>/dev/null
            mkdir -p dist/PointifyPOS-Mac
            cp "/tmp/node-v${NODE_VER}-darwin-${ARCH}/bin/node" \
               "dist/PointifyPOS-Mac/node-${ARCH}"
            chmod +x "dist/PointifyPOS-Mac/node-${ARCH}"
          done

      # Assemble the Mac package folder
      - name: Assemble Mac package
        run: |
          PKG="dist/PointifyPOS-Mac"
          mkdir -p "$PKG/server/dist" "$PKG/server/node_modules" "$PKG/client/dist"

          cp server/dist/index.cjs "$PKG/server/dist/"
          cp server/package.json   "$PKG/server/"
          cp -r client/dist/.      "$PKG/client/dist/"

          for pkg in firebase-admin @firebase @google-cloud google-gax @grpc \
                     protobufjs google-auth-library gcp-metadata @opentelemetry \
                     fast-xml-parser jose multer; do
            [ -d "server/node_modules/$pkg" ] && \
              cp -r "server/node_modules/$pkg" "$PKG/server/node_modules/"
          done

          SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
          cat > "$PKG/.env" << EOF
          SESSION_SECRET=${SECRET}
          PORT=3000
          POINTIFY_API_URL=https://api.pointifypos.com
          POINTIFY_OFFLINE_API_URL=https://api.pointifypos.com
          NODE_ENV=production
          EOF

          cat > "$PKG/Start Pointify POS.command" << 'CMD'
          #!/bin/bash
          cd "$(dirname "$0")"
          [ ! -f ".env" ] && echo "ERROR: .env not found" && exit 1
          set -a; source .env; set +a
          NODE="./node-$(uname -m | sed 's/x86_64/x64/')"
          echo ""
          echo "  ============================================"
          echo "   Pointify POS  |  Port $PORT"
          echo "  ============================================"
          echo "   Other tills: open a browser and go to"
          ifconfig | grep "inet " | grep -v "127.0.0.1" | \
            awk -v p="$PORT" '{print "     http://" $2 ":" p}'
          echo "  ============================================"
          echo "   Keep this window open. Press Ctrl+C to stop."
          echo ""
          "$NODE" server/dist/index.cjs
          read -p "Server stopped. Press Enter to close..."
          CMD
          chmod +x "$PKG/Start Pointify POS.command"

          cat > "$PKG/setup-autostart.sh" << 'AUTO'
          #!/bin/bash
          cd "$(dirname "$0")"
          INSTALL_DIR="$(pwd)"
          set -a; source "$INSTALL_DIR/.env"; set +a
          NODE="$INSTALL_DIR/node-$(uname -m | sed 's/x86_64/x64/')"
          LABEL="com.pointifypos.server"
          PLIST="$HOME/Library/LaunchAgents/${LABEL}.plist"
          cat > "$PLIST" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>Label</key><string>${LABEL}</string>
            <key>ProgramArguments</key>
            <array><string>${NODE}</string><string>${INSTALL_DIR}/server/dist/index.cjs</string></array>
            <key>WorkingDirectory</key><string>${INSTALL_DIR}</string>
            <key>EnvironmentVariables</key>
            <dict>
              <key>NODE_ENV</key><string>production</string>
              <key>PORT</key><string>${PORT}</string>
              <key>SESSION_SECRET</key><string>${SESSION_SECRET}</string>
              <key>POINTIFY_API_URL</key><string>${POINTIFY_API_URL}</string>
            </dict>
            <key>RunAtLoad</key><true/>
            <key>KeepAlive</key><true/>
            <key>StandardOutPath</key><string>/tmp/pointifypos.log</string>
            <key>StandardErrorPath</key><string>/tmp/pointifypos-error.log</string>
          </dict></plist>
          PLIST
          launchctl unload "$PLIST" 2>/dev/null || true
          launchctl load "$PLIST"
          echo "Auto-start registered. POS is now running in the background."
          AUTO
          chmod +x "$PKG/setup-autostart.sh"

          cp SETUP.md "$PKG/README.txt"

      # Create the DMG with a drag-to-Applications layout
      - name: Create DMG
        run: |
          mkdir -p /tmp/dmg-staging
          cp -r dist/PointifyPOS-Mac /tmp/dmg-staging/"Pointify POS"
          ln -s /Applications /tmp/dmg-staging/Applications

          hdiutil create \
            -volname "Pointify POS" \
            -srcfolder /tmp/dmg-staging \
            -ov \
            -format UDZO \
            -o dist/PointifyPOS.dmg

          echo "DMG size: $(du -sh dist/PointifyPOS.dmg | cut -f1)"

      - name: Upload Mac DMG
        uses: actions/upload-artifact@v4
        with:
          name: PointifyPOS-Mac-DMG
          path: dist/PointifyPOS.dmg
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # Release — attaches both files to a GitHub Release
  # Only runs when triggered by a version tag (e.g. v1.0.0)
  # ─────────────────────────────────────────────────────────────
  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: PointifyPOS-Windows-Setup

      - name: Download Mac DMG
        uses: actions/download-artifact@v4
        with:
          name: PointifyPOS-Mac-DMG

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Pointify POS ${{ github.ref_name }}"
          body: |
            ## Pointify POS ${{ github.ref_name }}

            | Platform | File | Notes |
            |---|---|---|
            | Windows | `PointifyPOS-Setup.exe` | Run installer as Administrator |
            | macOS | `PointifyPOS.dmg` | Open → drag Pointify POS to Applications |

            No separate Node.js install needed on either platform.
            Other tills connect via browser on the same network.
          files: |
            PointifyPOS-Setup.exe
            PointifyPOS.dmg
